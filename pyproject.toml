[project]
name = "privateboost-paper"
version = "0.1.0"
description = "Scripts and figures for the PrivateBoost paper"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "numpy>=2.0.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.8.0",
    "xgboost>=3.1.3",
    "matplotlib>=3.8.0",
    "scipy>=1.12.0",
    "seaborn>=0.13.2",
    "openpyxl>=3.1.5",
    # analysis/prepare_datasets.py fetches CDC BRFSS through the UCI repository
    # client; without it that dataset cannot be rebuilt from source.
    "ucimlrepo>=0.0.7",
]

# Only fetch.py, export_fleet.py and plots.py talk to Firestore. Keeping the
# client out of the default set means `just figures` — the entry point for a
# reader regenerating from the committed results/ — never resolves grpcio.
[dependency-groups]
fleet = [
    "google-cloud-firestore>=2.16",
    "pyarrow>=16",
]

[tool.ruff]
line-length = 100
