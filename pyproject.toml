[project]
name = "privateboost-paper"
version = "0.1.0"
description = "Scripts and figures for the PrivateBoost paper"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "numpy>=2.0.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.8.0",
    "xgboost>=3.1.3",
    "matplotlib>=3.8.0",
    "scipy>=1.12.0",
    "seaborn>=0.13.0",
    "ucimlrepo>=0.0.7",
]

[tool.ruff]
line-length = 100
