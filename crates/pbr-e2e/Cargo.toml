[package]
name = "pbr-e2e"
version = "0.1.0"
edition.workspace = true
publish = false

# Test-only crate: the library target is empty. `tests/heart_disease.rs`
# spawns the real `pbr-server` binaries (3 shareholders + 1 aggregator) and
# gates on heart_disease AUC; `tests/data_provenance.rs` pins the app's
# bundled train split to `pbr-core`'s CSV.

[dev-dependencies]
pbr-core.workspace = true
pbr-proto = { path = "../pbr-proto" }
pbr-client = { path = "../pbr-client", features = ["dev-mint"] }
tonic.workspace = true
tokio.workspace = true
rustls.workspace = true
toml.workspace = true
