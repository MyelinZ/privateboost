<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="figure:width" content="1400">
    <meta name="figure:height" content="520">
    <meta name="figure:scale" content="2">
    <meta name="figure:quality" content="95">
    <title>Path Hiding</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background: white; color: #1e293b; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">
    <div class="w-full max-w-7xl mx-auto">
        <svg viewBox="0 0 1360 480" class="w-full">
            <defs>
                <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
                    <polygon points="0,0 8,3 0,6" fill="#64748b"/>
                </marker>
                <marker id="arrowBlue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
                    <polygon points="0,0 8,3 0,6" fill="#2563eb"/>
                </marker>
                <marker id="arrowRed" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
                    <polygon points="0,0 8,3 0,6" fill="#dc2626"/>
                </marker>
                <marker id="arrowGray" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
                    <polygon points="0,0 8,3 0,6" fill="#94a3b8"/>
                </marker>

                <!-- Person icon -->
                <symbol id="person" viewBox="0 0 20 24">
                    <circle cx="10" cy="6" r="4" fill="none" stroke="currentColor" stroke-width="1.6"/>
                    <path d="M2 23 C2 16 5 13 10 13 C15 13 18 16 18 23" fill="none" stroke="currentColor" stroke-width="1.6"/>
                </symbol>
            </defs>

            <!-- ===== PANEL (a): WITHOUT PATH HIDING ===== -->
            <text x="310" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">(a) Without Path Hiding</text>

            <!-- Tree structure -->
            <!-- Root node (depth 0) -->
            <rect x="250" y="60" width="120" height="36" rx="6" fill="#f1f5f9" stroke="#1e293b" stroke-width="1.5"/>
            <text x="310" y="83" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">glucose ≤ 140</text>

            <!-- Depth 1 nodes -->
            <rect x="130" y="140" width="120" height="36" rx="6" fill="#f1f5f9" stroke="#1e293b" stroke-width="1.5"/>
            <text x="190" y="163" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">age ≤ 50</text>

            <rect x="370" y="140" width="120" height="36" rx="6" fill="#f1f5f9" stroke="#1e293b" stroke-width="1.5"/>
            <text x="430" y="163" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">bmi ≤ 30</text>

            <!-- Depth 2 leaf nodes -->
            <rect x="70" y="220" width="70" height="32" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
            <text x="105" y="240" text-anchor="middle" font-size="11" fill="#64748b">Leaf A</text>

            <!-- Highlighted leaf — client's true node -->
            <rect x="210" y="220" width="70" height="32" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
            <text x="245" y="240" text-anchor="middle" font-size="11" font-weight="600" fill="#2563eb">Leaf B</text>

            <rect x="340" y="220" width="70" height="32" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
            <text x="375" y="240" text-anchor="middle" font-size="11" fill="#64748b">Leaf C</text>

            <rect x="480" y="220" width="70" height="32" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
            <text x="515" y="240" text-anchor="middle" font-size="11" fill="#64748b">Leaf D</text>

            <!-- Tree edges -->
            <line x1="280" y1="96" x2="220" y2="140" stroke="#1e293b" stroke-width="1.3"/>
            <line x1="340" y1="96" x2="400" y2="140" stroke="#1e293b" stroke-width="1.3"/>
            <line x1="160" y1="176" x2="120" y2="220" stroke="#1e293b" stroke-width="1.3"/>
            <line x1="220" y1="176" x2="240" y2="220" stroke="#1e293b" stroke-width="1.3"/>
            <line x1="400" y1="176" x2="370" y2="220" stroke="#1e293b" stroke-width="1.3"/>
            <line x1="460" y1="176" x2="500" y2="220" stroke="#1e293b" stroke-width="1.3"/>

            <!-- Highlighted path (root → left → right = Leaf B) -->
            <line x1="280" y1="96" x2="220" y2="140" stroke="#2563eb" stroke-width="2.5"/>
            <line x1="220" y1="176" x2="240" y2="220" stroke="#2563eb" stroke-width="2.5"/>

            <!-- Client -->
            <rect x="180" y="310" width="130" height="44" rx="6" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
            <g color="#0d9488"><use href="#person" x="190" y="314" width="16" height="20"/></g>
            <text x="260" y="337" text-anchor="middle" font-size="12" font-weight="500" fill="#0d9488">Client i</text>

            <!-- Arrow from client to only Leaf B -->
            <line x1="245" y1="310" x2="245" y2="258" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
            <text x="268" y="288" font-size="11" font-weight="600" fill="#2563eb">shares of (g, h)</text>

            <!-- Problem callout -->
            <rect x="60" y="390" width="500" height="54" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
            <text x="310" y="413" text-anchor="middle" font-size="14" font-weight="600" fill="#991b1b">Shareholder learns client's tree path</text>
            <text x="310" y="433" text-anchor="middle" font-size="12" fill="#991b1b">glucose ≤ 140 → age &gt; 50 → reveals clinical thresholds</text>

            <!-- ===== DIVIDER ===== -->
            <line x1="640" y1="14" x2="640" y2="460" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="8,4"/>

            <!-- ===== PANEL (b): WITH PATH HIDING ===== -->
            <text x="1000" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">(b) With Path Hiding</text>

            <!-- Tree structure (same layout) -->
            <!-- Root -->
            <rect x="940" y="60" width="120" height="36" rx="6" fill="#f1f5f9" stroke="#1e293b" stroke-width="1.5"/>
            <text x="1000" y="83" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">glucose ≤ 140</text>

            <!-- Depth 1 -->
            <rect x="820" y="140" width="120" height="36" rx="6" fill="#f1f5f9" stroke="#1e293b" stroke-width="1.5"/>
            <text x="880" y="163" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">age ≤ 50</text>

            <rect x="1060" y="140" width="120" height="36" rx="6" fill="#f1f5f9" stroke="#1e293b" stroke-width="1.5"/>
            <text x="1120" y="163" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">bmi ≤ 30</text>

            <!-- Depth 2 leaf nodes — all receive shares -->
            <rect x="760" y="220" width="70" height="32" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,2"/>
            <text x="795" y="240" text-anchor="middle" font-size="11" fill="#64748b">Leaf A</text>

            <rect x="900" y="220" width="70" height="32" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
            <text x="935" y="240" text-anchor="middle" font-size="11" font-weight="600" fill="#2563eb">Leaf B</text>

            <rect x="1030" y="220" width="70" height="32" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,2"/>
            <text x="1065" y="240" text-anchor="middle" font-size="11" fill="#64748b">Leaf C</text>

            <rect x="1170" y="220" width="70" height="32" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,2"/>
            <text x="1205" y="240" text-anchor="middle" font-size="11" fill="#64748b">Leaf D</text>

            <!-- Tree edges -->
            <line x1="970" y1="96" x2="910" y2="140" stroke="#1e293b" stroke-width="1.3"/>
            <line x1="1030" y1="96" x2="1090" y2="140" stroke="#1e293b" stroke-width="1.3"/>
            <line x1="850" y1="176" x2="810" y2="220" stroke="#1e293b" stroke-width="1.3"/>
            <line x1="910" y1="176" x2="930" y2="220" stroke="#1e293b" stroke-width="1.3"/>
            <line x1="1090" y1="176" x2="1060" y2="220" stroke="#1e293b" stroke-width="1.3"/>
            <line x1="1150" y1="176" x2="1190" y2="220" stroke="#1e293b" stroke-width="1.3"/>

            <!-- Client -->
            <rect x="935" y="310" width="130" height="44" rx="6" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
            <g color="#0d9488"><use href="#person" x="945" y="314" width="16" height="20"/></g>
            <text x="1015" y="337" text-anchor="middle" font-size="12" font-weight="500" fill="#0d9488">Client i</text>

            <!-- Arrows from client to ALL leaves -->
            <!-- To Leaf A (zero shares) -->
            <line x1="960" y1="310" x2="795" y2="258" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowGray)"/>
            <text x="740" y="272" font-size="10" fill="#94a3b8" font-weight="500">shares of (0, 0)</text>

            <!-- To Leaf B (real shares) -->
            <line x1="980" y1="310" x2="940" y2="258" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
            <text x="970" y="272" font-size="10" fill="#2563eb" font-weight="600">shares of (g, h)</text>

            <!-- To Leaf C (zero shares) -->
            <line x1="1020" y1="310" x2="1065" y2="258" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowGray)"/>
            <text x="1065" y="272" font-size="10" fill="#94a3b8" font-weight="500">shares of (0, 0)</text>

            <!-- To Leaf D (zero shares) -->
            <line x1="1040" y1="310" x2="1205" y2="258" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowGray)"/>
            <text x="1210" y="272" font-size="10" fill="#94a3b8" font-weight="500">shares of (0, 0)</text>

            <!-- Benefit callout -->
            <rect x="720" y="390" width="560" height="54" rx="8" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/>
            <text x="1000" y="413" text-anchor="middle" font-size="14" font-weight="600" fill="#0d9488">Shareholder cannot distinguish real from zero shares</text>
            <text x="1000" y="433" text-anchor="middle" font-size="12" fill="#0d9488">Aggregates are identical: zero shares do not alter gradient sums</text>
        </svg>
    </div>
</body>
</html>
